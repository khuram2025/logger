# rsyslog configuration for log analyzer

# Global directives
global(
    workDirectory="/var/spool/rsyslog"
)

# Load modules
module(load="imudp")
module(load="imtcp")
module(load="imptcp")
module(load="omstdout")

# UDP input
input(type="imudp" port="514")

# TCP input
input(type="imtcp" port="514")

# Performance tuning
main_queue(
    queue.workerthreads="4"
    queue.dequeuebatchsize="1000"
    queue.size="50000"
)

# Templates for different log types
template(name="FortiGateTemplate" type="string"
    string="/var/log/fortigate/%HOSTNAME%/%$YEAR%-%$MONTH%-%$DAY%.log"
)

template(name="PaloAltoTemplate" type="string"
    string="/var/log/paloalto/%HOSTNAME%/%$YEAR%-%$MONTH%-%$DAY%.log"
)

template(name="GenericTemplate" type="string"
    string="/var/log/generic/%HOSTNAME%/%$YEAR%-%$MONTH%-%$DAY%.log"
)

# Rules for routing logs
if $msg contains "devname=" then {
    action(type="omfile" dynaFile="FortiGateTemplate" createDirs="on")
}

if $msg contains "TRAFFIC" or $msg contains "THREAT" then {
    action(type="omfile" dynaFile="PaloAltoTemplate" createDirs="on")
}

# Default rule - catch all
*.* action(type="omfile" dynaFile="GenericTemplate" createDirs="on")

# Include additional configuration files
$IncludeConfig /etc/rsyslog.d/*.conf