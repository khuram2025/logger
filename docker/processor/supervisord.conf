[supervisord]
nodaemon=true
user=processor
logfile=/app/logs/supervisord.log
pidfile=/app/state/supervisord.pid

[program:log_manager]
command=python /app/scripts/log_manager_optimized.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/log_manager.err.log
stdout_logfile=/app/logs/log_manager.out.log
user=processor

[program:fortigate_processor]
command=python /app/scripts/fortigate_to_clickhouse.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/fortigate.err.log
stdout_logfile=/app/logs/fortigate.out.log
user=processor

[program:paloalto_processor]
command=python /app/scripts/paloalto_to_clickhouse.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/paloalto.err.log
stdout_logfile=/app/logs/paloalto.out.log
user=processor

[program:device_monitor]
command=python /app/scripts/real_time_device_monitor.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/logs/device_monitor.err.log
stdout_logfile=/app/logs/device_monitor.out.log
user=processor